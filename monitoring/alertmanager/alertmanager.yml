
global:
  resolve_timeout: 5m

route:
  receiver: api-webhook
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: api-webhook-critical

    - matchers:
        - severity="warning"
      receiver: api-webhook-warning

receivers:
  - name: api-webhook
    webhook_configs:
      - url: 'http://api:8000/api/alerts/webhook'
        send_resolved: true

  - name: api-webhook-critical
    webhook_configs:
      - url: 'http://api:8000/api/alerts/webhook'
        send_resolved: true

  - name: api-webhook-warning
    webhook_configs:
      - url: 'http://api:8000/api/alerts/webhook'
        send_resolved: true
